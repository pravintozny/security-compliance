<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security incidents</title>
  <link rel="stylesheet" href="/src/incidents/incidents.css">
</head>
<body>
  <main>
    <h1>Security incidents</h1>
    <section class="filters" aria-label="Filters">
      <label>Severity <select id="filter-severity"></select></label>
      <label>Status <select id="filter-status"></select></label>
      <button id="clear-filters" type="button">Clear filters</button>
      <span id="count" role="status"></span>
    </section>
    <table id="incident-table">
      <thead>
        <tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Reported</th><th>Owner</th></tr>
      </thead>
      <tbody id="incident-rows"></tbody>
    </table>
    <p id="empty-state" class="empty" hidden>No incidents match the selected filters.</p>
  </main>
  <script type="module" src="/src/incidents/main.js"></script>
</body>
</html>
